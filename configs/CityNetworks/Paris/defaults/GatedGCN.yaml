
out_dir: results
metric_best: accuracy
wandb:
  use: True
  project: CityNetworks-Paris
dataset:
  format: PyG-CityNetwork
  name: Paris
  task: node    # sometimes should be node, sometimes graph
  task_type: classification
  transductive: True
  node_encoder: True
  node_encoder_name: CityNetworkNode
  node_encoder_bn: False
  edge_encoder: True
  edge_encoder_name: DummyEdge
  edge_encoder_bn: False
posenc_LapPE:
  enable: False
  eigen:
    laplacian_norm: none
    eigvec_norm: L2
    max_freqs: 10
  model: DeepSet
  dim_pe: 16
  layers: 2
  raw_norm_type: none
posenc_RWSE:
  enable: False
  kernel:
    times_func: range(1,21)
  model: Linear
  dim_pe: 28
  raw_norm_type: BatchNorm
train:
  ckpt_best: True
  mode: custom
  batch_size: 50
  eval_period: 20
  ckpt_period: 100
  eval_smoothing_metrics: True
model:
  auto_satisfy_param_budget: True
  param_budget: 500000
  type: custom_gnn
  loss_fun: weighted_cross_entropy
gnn:
  head: default
  layers_pre_mp: 0
  layers_mp: 8
  layers_post_mp: 2
  dim_inner: 235
  layer_type: gatedgcnconv
  act: gelu
  residual: True
  dropout: 0.1
  batchnorm: True
optim:
  optimizer: adamW
  weight_decay: 0.0
  base_lr: 0.001
  max_epoch: 1500
  scheduler: cosine_with_warmup
  num_warmup_epochs: 10
